version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-tradier}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - TRADIER_BASE_URL=${TRADIER_BASE_URL:-https://api.tradier.com/v1}
      - TRADIER_ENTITLEMENT=${TRADIER_ENTITLEMENT:-realtime}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=opc
      - POSTGRES_PASSWORD=${DB_PASSWORD:-opc_dev_password}
      - POSTGRES_DB=opc
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opc"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
