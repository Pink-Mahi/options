version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://opc:opc_dev_password@127.0.0.1:5432/opc?schema=public
      - MARKET_DATA_PROVIDER=${MARKET_DATA_PROVIDER:-tradier}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - TRADIER_BASE_URL=${TRADIER_BASE_URL:-https://api.tradier.com/v1}
      - TRADIER_ENTITLEMENT=${TRADIER_ENTITLEMENT:-realtime}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-}
    # NOTE: /var/lib/postgresql/data persistence is managed via Coolify's
    # Persistent Storage UI mount (named volume), not docker-compose volumes.
    restart: unless-stopped
