<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Candlestick bars -->
  <rect x="96" y="240" width="24" height="120" rx="6" fill="#64748b"/>
  <rect x="104" y="200" width="8" height="200" rx="4" fill="#64748b"/>
  <rect x="160" y="180" width="24" height="140" rx="6" fill="url(#green)"/>
  <rect x="168" y="140" width="8" height="220" rx="4" fill="url(#green)"/>
  <rect x="224" y="200" width="24" height="100" rx="6" fill="#64748b"/>
  <rect x="232" y="160" width="8" height="180" rx="4" fill="#64748b"/>
  <rect x="288" y="140" width="24" height="160" rx="6" fill="url(#green)"/>
  <rect x="296" y="100" width="8" height="240" rx="4" fill="url(#green)"/>
  <!-- Trend line -->
  <path d="M 80 340 L 160 260 L 240 300 L 320 180 L 400 120" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Dollar sign -->
  <text x="380" y="300" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#fbbf24" text-anchor="middle">$</text>
</svg>
